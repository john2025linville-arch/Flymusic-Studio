name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        cmdline-tools-version: latest

    - name: Accept Android SDK Licenses
      run: yes | sdkmanager --licenses || true

    - name: Generate Android Project Structure & Build APK
      run: |
        mkdir -p my-android-project/app/src/main/assets
        mkdir -p my-android-project/app/src/main/java/com/flymusic/studio/app
        mkdir -p my-android-project/app/src/main/res/values

        cp index.html my-android-project/app/src/main/assets/index.html

        cat << 'EOF' > my-android-project/app/src/main/java/com/flymusic/studio/app/MainActivity.java
        package com.flymusic.studio.app;

        import android.Manifest;
        import android.content.pm.PackageManager;
        import android.os.Bundle;
        import android.webkit.PermissionRequest;
        import android.webkit.WebChromeClient;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import androidx.appcompat.app.AppCompatActivity;
        import androidx.core.app.ActivityCompat;
        import androidx.core.content.ContextCompat;

        public class MainActivity extends AppCompatActivity {
            private WebView webView;
            private static final int PERMISSION_REQUEST_CODE = 200;

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO, Manifest.permission.WRITE_EXTERNAL_STORAGE}, PERMISSION_REQUEST_CODE);
                }
                webView = new WebView(this);
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setMediaPlaybackRequiresUserGesture(false);
                webView.setWebViewClient(new WebViewClient());
                webView.setWebChromeClient(new WebChromeClient() {
                    @Override
                    public void onPermissionRequest(final PermissionRequest request) {
                        request.grant(request.getResources());
                    }
                });
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }
        }
        EOF

        cat << 'EOF' > my-android-project/app/build.gradle
        plugins { id 'com.android.application' }
        android {
            namespace 'com.flymusic.studio.app'
            compileSdk 34
            defaultConfig {
                applicationId "com.flymusic.studio.app"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        cat << 'EOF' > my-android-project/build.gradle
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.5.0' }
        }
        allprojects { repositories { google(); mavenCentral() } }
        EOF

        cat << 'EOF' > my-android-project/settings.gradle
        rootProject.name = "Flymusic Studio"
        include ':app'
        EOF

        cat << 'EOF' > my-android-project/app/src/main/res/values/strings.xml
        <resources><string name="app_name">Flymusic Studio</string></resources>
        EOF

        cat << 'EOF' > my-android-project/app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.flymusic.studio.app">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
            <application android:allowBackup="true" android:label="Flymusic Studio" android:supportsRtl="true" android:hardwareAccelerated="true" android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cd my-android-project
        gradle wrapper --gradle-version 8.7 --distribution-type bin
        chmod +x gradlew
        ./gradlew assembleRelease --warning-mode all

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Flymusic-Studio-APK
        path: my-android-project/app/build/outputs/apk/release/app-release-unsigned.apk
